<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agustin Marquez - Paintings</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Additional styles specific to the photos page */
        .photo-intro {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            margin: 80px 0;
            padding: 0 5%;
            position: relative;
            overflow: hidden;
        }
        
        .photo-intro h1 {
            font-size: 4.5rem;
            font-weight: 700;
            text-transform: uppercase;
            margin: 0;
            flex: 1;
            position: relative;
            z-index: 2;
        }
        
        .photo-intro-text {
            flex: 1.5;
            padding-left: 5%;
            padding-top: 2rem;
            position: relative;
            z-index: 2;
        }
        
        .photo-intro-text p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }
        
        .photo-intro::before {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px solid #ddd; /* Changed from #333 to lighter gray */
            top: -30px;
            left: 40%;
            z-index: 1;
            opacity: 0.5; /* Increased opacity for light theme */
        }
        
        .photo-intro::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: rgba(200, 200, 200, 0.3); /* Lighter background */
            bottom: 20px;
            right: 10%;
            z-index: 1;
        }
        
        .photos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 2rem;
            padding: 0 5%;
            margin-bottom: 80px;
        }
        
        .photo-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .photo-item:hover {
            transform: translateY(-5px);
        }
        
        .photo-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        
        .photo-item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            padding: 20px;
            color: white; /* Keeping text white for contrast against dark overlay */
        }
        
        .photo-item-overlay h3 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
        }
        
        .photo-item-overlay p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        @media (max-width: 900px) {
            .photos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .photo-intro {
                flex-direction: column;
            }
            
            .photo-intro-text {
                padding-left: 0;
                padding-top: 2rem;
            }
        }
        
        @media (max-width: 600px) {
            .photos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <style>
        .carousel-container {
            width: 100%;
            height: 100vh; /* Adjust as needed, or set a fixed height */
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .carousel-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 1s ease-in-out;
        }
    </style>
</head>
<body>
    <!-- Navbar Container - Will be filled by JavaScript -->
    <!-- <div id="navbar-container"></div> -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-item"><a href="videos.html" id="videos-link">VIDEO</a></div>
            <div class="nav-item"><a href="photos.html"  id="photos-link">PHOTO</a></div>
            <div class="nav-item name-container">
                <a href="index.html">
                    <div class="name-wrapper">
                        <div class="main-name">AGUSTIN MARQUEZ</div>
                        <!-- <div class="subtitle">Filmmaker, Photographer, Painter</div> -->
                    </div>
                </a>
            </div>
            <div class="nav-item"><a href="paintings.html" class="active" id="paintings-link">PAINTING</a></div>
            <div class="nav-item"><a href="about.html" id="about-link">ABOUT</a></div>
        </div>
    </nav>

        <div class="carousel-container">
            <img id="still-image" src="media/paintings/1.jpg" alt="Agustin Marquez Photo" >
        </div>

    <script>
        const carouselContainer = document.querySelector('.carousel-container');
        let currentImage = document.getElementById('still-image');
        let currentIndex = 1;
        const totalImages = 20;

        function preloadImage(index) {
            if (totalImages <= 1) return;
            const img = new Image();
            img.src = `media/paintings/${index}.jpg`;
        }

        carouselContainer.addEventListener('click', (event) => {
            const rect = carouselContainer.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const containerWidth = carouselContainer.offsetWidth;
            let nextIndex;
            let slideOutDirection;
            let slideInDirection;

            if (clickX < containerWidth / 3) {
                // Go backward
                nextIndex = (currentIndex - 1 + totalImages) % totalImages;
                slideOutDirection = 'translateX(100%)'; // Current slides out to the right
                slideInDirection = '-100%'; // New slides in from the left
                console.log('Carousel clicked left - going back'); // TODO
            } else {
                // Go forward
                nextIndex = (currentIndex + 1) % totalImages;
                slideOutDirection = 'translateX(-100%)'; // Current slides out to the left
                slideInDirection = '100%'; // New slides in from the right
                console.log('Carousel clicked center/right - going forward'); // TODO
            }
            
            const nextImageElement = document.createElement('img');
            nextImageElement.src = `media/paintings/${nextIndex}.jpg`;
            nextImageElement.alt = `Agustin Marquez Photo ${nextIndex + 1}`;
            nextImageElement.style.transform = `translateX(${slideInDirection})`;
            
            
            carouselContainer.appendChild(nextImageElement);
            void nextImageElement.offsetWidth; 
            
            currentImage.style.transform = slideOutDirection;
            nextImageElement.style.transform = 'translateX(0%)';
            
            setTimeout(() => {
                if (currentImage.parentNode === carouselContainer) {
                    carouselContainer.removeChild(currentImage);
                }
                currentImage = nextImageElement;
                currentIndex = nextIndex;
                // Preload the appropriate next or previous image for the *next* click
                if (clickX < containerWidth / 3) {
                    preloadImage((currentIndex - 1 + totalImages) % totalImages);
                } else {
                    preloadImage((currentIndex + 1) % totalImages);
                }
            }, 1000);
        });

        if (totalImages > 0) {
            preloadImage((currentIndex + 1) % totalImages); // Preload next
            if (totalImages > 1) {
                 preloadImage((currentIndex - 1 + totalImages) % totalImages); // Preload previous as well
            }
        }
    </script>
</body>

</html>
