    <style>
        /* Styles for Glide carousel, adjusted from original */
        .glide {
            margin-top: 70px;
            /* Account for fixed navbar */
            height: calc(100vh - 70px);
            /* Fill remaining viewport height */
            width: 100%;
            position: relative;
            overflow: hidden;
            background-color: black;
            cursor: pointer;
        }

        .glide__track {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .glide__slides {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            list-style-type: none;
        }

        .glide__slide {
            width: 100%;
            height: 100%;
        }

        .glide__slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
    <style>
        /* === Glide Controls Styling === */

        /* Individual Arrow Buttons */
        .glide button[data-glide-dir] {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.3);
            /* Semi-transparent black */
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1.5rem;
            /* Adjust size of arrows */
            cursor: pointer;
            z-index: 10;
            border-radius: 5px;
            /* Slightly rounded corners */
            transition: background-color 0.3s ease;
        }

        .glide button[data-glide-dir]:hover {
            background-color: rgba(0, 0, 0, 0.6);
            /* Darker on hover */
        }

        .glide button[data-glide-dir="<"] {
            left: 20px;
            /* Adjust as needed */
        }

        .glide button[data-glide-dir=">"] {
            right: 20px;
            /* Adjust as needed */
        }

        /* Bullet Navigation Container */
        .glide__bullets {
            position: absolute;
            bottom: 20px;
            /* Distance from bottom */
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 8px;
            /* Space between bullets */
        }

        /* Individual Bullets */
        .glide__bullet {
            background-color: rgba(255, 255, 255, 0.4);
            /* Semi-transparent white */
            width: 12px;
            height: 12px;
            border-radius: 50%;
            /* Circular bullets */
            border: none;
            padding: 0;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .glide__bullet:hover {
            background-color: rgba(255, 255, 255, 0.7);
        }

        /* Active Bullet */
        .glide__bullet--active {
            background-color: rgba(255, 255, 255, 0.9);
            /* More opaque white */
        }
    </style>
    <style>
        /* Additional styles specific to the photos page */
        .photo-intro {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            margin: 80px 0;
            padding: 0 5%;
            position: relative;
            overflow: hidden;
        }
        
        .photo-intro h1 {
            font-size: 4.5rem;
            font-weight: 700;
            text-transform: uppercase;
            margin: 0;
            flex: 1;
            position: relative;
            z-index: 2;
        }
        
        .photo-intro-text {
            flex: 1.5;
            padding-left: 5%;
            padding-top: 2rem;
            position: relative;
            z-index: 2;
        }
        
        .photo-intro-text p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }
        
        .photo-intro::before {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px solid #ddd; /* Changed from #333 to lighter gray */
            top: -30px;
            left: 40%;
            z-index: 1;
            opacity: 0.5; /* Increased opacity for light theme */
        }
        
        .photo-intro::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: rgba(200, 200, 200, 0.3); /* Lighter background */
            bottom: 20px;
            right: 10%;
            z-index: 1;
        }
        
        .photos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 2rem;
            padding: 0 5%;
            margin-bottom: 80px;
        }
        
        .photo-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .photo-item:hover {
            transform: translateY(-5px);
        }
        
        .photo-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        
        .photo-item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            padding: 20px;
            color: white; /* Keeping text white for contrast against dark overlay */
        }
        
        .photo-item-overlay h3 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
        }
        
        .photo-item-overlay p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        @media (max-width: 900px) {
            .photos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .photo-intro {
                flex-direction: column;
            }
            
            .photo-intro-text {
                padding-left: 0;
                padding-top: 2rem;
            }
        }
        
        @media (max-width: 600px) {
            .photos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        const glide = new Glide('.glide', {
            animationDuration: 1000,
            animationTimingFunc: 'ease-in-out',
            perView: 1,
            gap: 0,
            hoverpause: true,
            keyboard: true,
            type: 'carousel'
        }).mount();

        const allSlideElements = document.querySelectorAll('.glide__slide');
        const totalNumberOfSlides = allSlideElements.length;
        const lazyLoadWindowRadius = 4; // Load current +/- this many slides

        function manageSlideImageLoading(currentIndex) {

            allSlideElements.forEach((slideLi, i) => {
                const img = slideLi.querySelector('img');
                console.log(img.src)
                console.log(i)
                if (!img) return;

                let diff = Math.abs(i - currentIndex);
                if (diff > totalNumberOfSlides / 2) {
                    diff = totalNumberOfSlides - diff;
                }

                if (diff <= lazyLoadWindowRadius) {
                    console.log('Eager loading: Index', i, 'Image:', img.src.split('/').pop());
                    if (img.getAttribute('loading') === 'lazy') {
                        img.setAttribute('loading', 'eager');
                    }
                }
            });

        }

        glide.on('mount.after', () => {
            manageSlideImageLoading(glide.index);
        });

        glide.on('run.after', () => {
            setTimeout(() => {
                manageSlideImageLoading(glide.index);
            }, 600);
        });
    </script>
