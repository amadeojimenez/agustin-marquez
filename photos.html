<script>
    const glide = new Glide('.glide', {
        animationDuration: 1000,
        animationTimingFunc: 'ease-in-out',
        perView: 1,
        gap: 0,
        hoverpause: true,
        keyboard: true,
        type: 'carousel'
    }).mount();

    const allSlideElements = document.querySelectorAll('.glide__slide');
    const totalNumberOfSlides = allSlideElements.length;
    const lazyLoadWindowRadius = 4; // Load current +/- this many slides

    function manageSlideImageLoading(currentIndex) {

        allSlideElements.forEach((slideLi, i) => {
            const img = slideLi.querySelector('img');
            console.log(img.src)
            console.log(i)
            if (!img) return;

            let diff = Math.abs(i - currentIndex);
            if (diff > totalNumberOfSlides / 2) {
                diff = totalNumberOfSlides - diff;
            }

            if (diff <= lazyLoadWindowRadius) {
                console.log('Eager loading: Index', i, 'Image:', img.src.split('/').pop());
                if (img.getAttribute('loading') === 'lazy') {
                    img.setAttribute('loading', 'eager');
                }
            }
        });

    }

    glide.on('mount.after', () => {
        manageSlideImageLoading(glide.index);
    });

    glide.on('run.after', () => {
        setTimeout(() => {
            manageSlideImageLoading(glide.index);
        }, 600);
    });

    const mobileMenuButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');

    if (mobileMenuButton && mobileMenu) {
        mobileMenuButton.addEventListener('click', () => {
            mobileMenuButton.classList.toggle('open');
            mobileMenu.classList.toggle('open');
        });
    }
</script>
