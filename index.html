<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agustin Marquez - Artist & Director</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Masonry layout for paintings in homepage */
        #paintings-summary .thumbnails-grid {
            column-count: 3;
            column-gap: 2rem;
            padding: 0;
            margin-bottom: 40px;
        }

        #paintings-summary .thumbnail-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            margin-bottom: 2rem;
            break-inside: avoid;
            display: block;
            aspect-ratio: auto;
            /* Override potential fixed aspect ratio */
        }

        #paintings-summary .thumbnail-item:hover {
            transform: translateY(-5px);
        }

        #paintings-summary .thumbnail-item img {
            width: 100%;
            height: auto;
            /* Allow image height to adjust */
            display: block;
            object-fit: cover;
            /* Keep cover, but height: auto allows aspect ratio */
        }

        #paintings-summary .thumbnail-item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            padding: 20px;
            color: white;
            /* Keep text white for contrast against dark overlay */
        }

        #paintings-summary .thumbnail-item-overlay h3 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
        }

        #paintings-summary .thumbnail-item-overlay p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (max-width: 900px) {
            #paintings-summary .thumbnails-grid {
                column-count: 2;
            }
        }

        @media (max-width: 600px) {
            #paintings-summary .thumbnails-grid {
                column-count: 1;
            }
        }

        /* Video section styles */
        #video-summary .thumbnail-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            margin-bottom: 2rem;
            aspect-ratio: 16/9;
            cursor: pointer;
        }

        #video-summary .thumbnail-item:hover {
            transform: translateY(-5px);
        }

        #video-summary .hover-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #video-summary .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0; /* Initially hidden */
            transition: opacity 0.3s ease;
        }

        #video-summary .thumbnail-item:hover .video-overlay {
            opacity: 1; /* Visible on hover */
        }

        #video-summary .video-overlay h3 {
            color: white;
            font-size: 1.5rem;
            text-align: center;
            margin: 0;
            padding: 1rem;
        }

        /* Photo section styles */
        #photo-summary .thumbnail-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            margin-bottom: 2rem;
            aspect-ratio: 3/2;
            cursor: pointer;
        }

        #photo-summary .thumbnail-item:hover {
            transform: translateY(-5px);
        }

        #photo-summary .thumbnail-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #photo-summary .photo-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0; /* Initially hidden */
            transition: opacity 0.3s ease;
        }

        #photo-summary .thumbnail-item:hover .photo-overlay {
            opacity: 1; /* Visible on hover */
        }

        #photo-summary .photo-overlay h3 {
            color: white;
            font-size: 1.5rem;
            text-align: center;
            margin: 0;
            padding: 1rem;
        }

        /* Paintings section styles */
        #paintings-summary .thumbnail-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            margin-bottom: 2rem;
            aspect-ratio: 3/2;
            cursor: pointer;
        }

        #paintings-summary .thumbnail-item:hover {
            transform: translateY(-5px);
        }

        #paintings-summary .thumbnail-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #paintings-summary .painting-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0; /* Initially hidden */
            transition: opacity 0.3s ease;
        }

        #paintings-summary .thumbnail-item:hover .painting-overlay {
            opacity: 1; /* Visible on hover */
        }

        #paintings-summary .painting-overlay h3 {
            color: white;
            font-size: 1.5rem;
            text-align: center;
            margin: 0;
            padding: 1rem;
        }

        /* Modal Styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 2000; /* Ensure it's on top */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto; /* Enable scroll if content is too big */
            background-color: rgba(0,0,0,0.9); /* Black background with opacity */
        }

        .modal-content {
            position: relative;
            margin: auto;
            padding: 0;
            width: 80%;
            max-width: 1600px; /* Increased max width */
            top: 50%;
            transform: translateY(-50%);
        }
        
        .modal-content img, .modal-content iframe {
            display: block;
            width: 100%;
            height: auto;
        }

        .modal-content iframe {
            aspect-ratio: 16/9; /* For videos */
        }

        .close-button {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
        }

        .close-button:hover,
        .close-button:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>

    <script src="js/main.js"></script>
    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
        // Video hover functionality
        document.addEventListener('DOMContentLoaded', function() {
            const videoItems = document.querySelectorAll('#video-summary .thumbnail-item');
            
            videoItems.forEach(item => {
                const video = item.querySelector('video');
                
                item.addEventListener('mouseenter', () => {
                    video.play();
                });
                
                item.addEventListener('mouseleave', () => {
                    video.pause();
                    video.currentTime = 0;
                });
            });
        });

        // Load paintings data for homepage
        document.addEventListener('DOMContentLoaded', function () {
            const paintingsSummaryGrid = document.getElementById('paintings-summary-grid');
            if (!paintingsSummaryGrid) return;

            // Fetch the painting data from JSON file
            fetch('data/paintingData.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    // Display only the first 10 paintings (or all if less than 10)
                    const displayPaintings = data.paintings.slice(0, 10);

                    // Generate the grid items
                    generatePaintingsSummaryGrid(displayPaintings);
                })
                .catch(error => {
                    console.error('Error loading painting data:', error);
                    paintingsSummaryGrid.innerHTML = '<p>Error loading paintings. Please refresh the page.</p>';
                });

            // Generate the paintings grid for the homepage
            function generatePaintingsSummaryGrid(paintings) {
                // Clear any existing content
                paintingsSummaryGrid.innerHTML = '';

                // Generate HTML for each painting
                paintings.forEach(painting => {
                    const paintingItem = document.createElement('div');
                    paintingItem.className = 'thumbnail-item';

                    paintingItem.innerHTML = `
                        <a href="paintings.html">
                            <img src="${painting.imgSrc}" alt="${painting.alt}">
                            <div class="thumbnail-item-overlay">
                                <h3>${painting.title}</h3>
                                <p>${painting.shortDescription}</p>
                            </div>
                        </a>
                    `;

                    paintingsSummaryGrid.appendChild(paintingItem);
                });
            }
        });

        // Show still image when video ends
        function showStillImage() {
            console.log('vamos!')
            const video = document.getElementById('hero-video');
            const stillImage = document.getElementById('still-image');
            video.style.display = 'none';
            stillImage.style.display = 'block';
        }

        // Lightbox Modal Functionality
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('lightbox-modal');
            const modalContent = modal.querySelector('.modal-content');
            const closeButton = modal.querySelector('.close-button');

            const thumbnailItems = document.querySelectorAll('#video-summary .thumbnail-item, #photo-summary .thumbnail-item, #paintings-summary .thumbnail-item');

            thumbnailItems.forEach(item => {
                item.addEventListener('click', function() {
                    modalContent.innerHTML = ''; // Clear previous content
                    
                    // Check if it's a video item with a Vimeo embed
                    const vimeoEmbed = item.dataset.vimeoEmbed;
                    if (vimeoEmbed) {
                        modalContent.innerHTML = vimeoEmbed;
                        // Adjust modal width for videos if necessary
                        modal.querySelector('.modal-content').style.maxWidth = '1600px'; 
                    } else {
                        // It's an image (photo or painting)
                        const img = item.querySelector('img');
                        if (img) {
                            const largeImage = document.createElement('img');
                            largeImage.src = img.src;
                            largeImage.alt = img.alt;
                            modalContent.appendChild(largeImage);
                             modal.querySelector('.modal-content').style.maxWidth = '1600px'; // Increased for images
                        }
                    }
                    modal.style.display = 'block';
                });
            });

            // Close modal when close button is clicked
            closeButton.addEventListener('click', function() {
                modal.style.display = 'none';
                modalContent.innerHTML = ''; // Clear content
            });

            // Close modal when clicking outside the modal content
            window.addEventListener('click', function(event) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                    modalContent.innerHTML = ''; // Clear content
                }
            });
        });
    </script>
