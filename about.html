    <style>
        /* Additional styles specific to the photos page */
        .photo-intro {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            margin: 80px 0;
            padding: 0 5%;
            position: relative;
            overflow: hidden;
        }
        
        .photo-intro h1 {
            font-size: 4.5rem;
            font-weight: 700;
            text-transform: uppercase;
            margin: 0;
            flex: 1;
            position: relative;
            z-index: 2;
        }
        
        .photo-intro-text {
            flex: 1.5;
            padding-left: 5%;
            padding-top: 2rem;
            position: relative;
            z-index: 2;
        }
        
        .photo-intro-text p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }
        
        .photo-intro::before {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px solid #ddd; /* Changed from #333 to lighter gray */
            top: -30px;
            left: 40%;
            z-index: 1;
            opacity: 0.5; /* Increased opacity for light theme */
        }
        
        .photo-intro::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: rgba(200, 200, 200, 0.3); /* Lighter background */
            bottom: 20px;
            right: 10%;
            z-index: 1;
        }
        
        .photos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 2rem;
            padding: 0 5%;
            margin-bottom: 80px;
        }
        
        .photo-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .photo-item:hover {
            transform: translateY(-5px);
        }
        
        .photo-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        
        .photo-item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            padding: 20px;
            color: white; /* Keeping text white for contrast against dark overlay */
        }
        
        .photo-item-overlay h3 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
        }
        
        .photo-item-overlay p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        @media (max-width: 900px) {
            .photos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .photo-intro {
                flex-direction: column;
            }
            
            .photo-intro-text {
                padding-left: 0;
                padding-top: 2rem;
            }
        }
        
        @media (max-width: 600px) {
            .photos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <style>
        .carousel-container {
            width: 100%;
            height: 100vh; /* Adjust as needed, or set a fixed height */
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .carousel-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 1s ease-in-out;
        }

        .contact-overlay {
            position: absolute;
            top: 50%;
            left: 49.52%;
            transform: translate(-50%, -50%);
            color: rgb(78, 78, 78);
            /* background-color: rgba(0, 0, 0, 0.5); */
            padding: 10px 20px;
            border-radius: 5px;
            text-align: center;
            z-index: 10; /* Ensure it's above the image */
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.05em;
        }
    </style>
